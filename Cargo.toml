[package]
name = "chetter-app"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"

[dependencies]
async-trait = "0.1"
axum = "0.8"
getopts = "0.2"
indoc = "2"
jsonwebtoken = "10"
octocrab = "0.49"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"]}
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
mockall = "0.14"
